# 기본 규칙 위에 바꾸는 것만 둔다(AOS-008)
naming:
  FunctionNaming:
    # Composable은 UpperCamelCase
    ignoreAnnotated: ['Composable']
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    # enum 생성자 인자(MaPeriod(20) 등)는 이름이 뜻을 준다
    ignoreEnums: true
    ignoreAnnotated: ['Composable', 'Preview']
